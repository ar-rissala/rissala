<title>{{ seo_title|default:"Rissala — Sciences Islamiques, Langue Arabe & Finance Éthique" }}</title>
<meta name="description" content="{{ seo_description|default:ui.footer_desc }}">
<meta name="robots" content="{{ seo_robots|default:'index, follow' }}">
{% if seo_canonical %}
<link rel="canonical" href="{{ seo_canonical }}">
{% endif %}
{% if seo_hreflangs %}
{% for h_lang, h_url in seo_hreflangs.items %}
<link rel="alternate" hreflang="{{ h_lang }}" href="{{ h_url }}">
{% endfor %}
{% if seo_x_default %}
<link rel="alternate" hreflang="x-default" href="{{ seo_x_default }}">
{% endif %}
{% endif %}

<!-- Open Graph -->
<meta property="og:site_name" content="Rissala">
<meta property="og:type" content="{{ seo_og_type|default:'website' }}">
<meta property="og:locale" content="{{ seo_og_locale|default:'fr_FR' }}">
<meta property="og:title" content="{{ seo_title|default:'Rissala' }}">
<meta property="og:description" content="{{ seo_description|default:ui.footer_desc }}">
{% if seo_canonical %}
<meta property="og:url" content="{{ seo_canonical }}">
{% endif %}
<meta property="og:image" content="{{ seo_og_image|default:'/static/LogoRissala.png' }}">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title|default:'Rissala' }}">
<meta name="twitter:description" content="{{ seo_description|default:ui.footer_desc }}">
<meta name="twitter:image" content="{{ seo_og_image|default:'/static/LogoRissala.png' }}">

<!-- Schema.org JSON-LD -->
{% if seo_json_ld %}
<script type="application/ld+json">
{{ seo_json_ld|safe }}
</script>
{% endif %}
