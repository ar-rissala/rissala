<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur (500) | Rissala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f7f5ef] dark:bg-[#0a0a0a] text-[#102a24] dark:text-[#f7f5ef] p-6">
  <div class="max-w-md text-center bg-white dark:bg-[#121212] border border-[#dde5e1] dark:border-[#27272a] rounded-2xl p-8 shadow-xl shadow-black/[0.03] dark:shadow-black/20">
    <div class="text-3xl font-bold text-[#006b54] dark:text-[#35a88b] mb-2 font-mono">500</div>
    <h1 class="text-xl font-bold mb-2">Une erreur technique est survenue</h1>
    <p class="mt-2 text-sm text-[#5e6e68] dark:text-[#a1a1aa] leading-relaxed">Veuillez réessayer dans quelques instants ou retourner à l'accueil.</p>
    <a href="/fr/" class="mt-6 inline-block px-5 py-2.5 rounded-xl bg-[#006b54] dark:bg-[#35a88b] text-white dark:text-[#0a0a0a] text-sm font-semibold hover:opacity-90 transition-opacity">Retour à l'accueil</a>
  </div>
</body>
</html>
