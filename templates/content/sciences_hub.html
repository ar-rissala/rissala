{% extends "base.html" %}
{% load rissala_tags %}

{% block content %}
<div class="flex flex-col min-h-screen bg-background">
  <!-- PageHero (Exact 1:1 match to Next.js SciencesIslamiquesPage) -->
  <section class="relative py-16 sm:py-20 lg:py-28 min-h-[380px] flex items-center border-b border-border/50 overflow-hidden">
    <div
      class="absolute inset-0 bg-cover bg-center"
      style="background-image: url('/islamic-pattern-bg.jpg');"
      aria-hidden="true"
    ></div>
    <div
      class="absolute inset-0 bg-background/[0.75] dark:bg-background/[0.80]"
      aria-hidden="true"
    ></div>
    <div
      class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary/10 via-transparent to-transparent pointer-events-none"
      aria-hidden="true"
    ></div>

    <div class="relative z-10 w-full">
      <div class="container mx-auto px-4 lg:px-8 max-w-4xl text-center">
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-black uppercase tracking-tight font-heading mb-6 text-foreground">
          {{ copy.title_main }} <span class="text-primary">{{ copy.title_accent }}</span>
        </h1>
        <p class="text-lg sm:text-xl text-muted-foreground leading-relaxed max-w-2xl mx-auto">
          {{ copy.description }}
        </p>
      </div>
    </div>
  </section>

  <!-- Editorial List (Exact match to Next.js Editorial List) -->
  <div class="container mx-auto px-4 lg:px-8 py-16 sm:py-24 max-w-4xl">
    <div class="flex flex-col border-t border-border/50">
      {% for theme in themes %}
      <a
        href="{{ base_url }}{{ theme.link }}/"
        class="group flex flex-col sm:flex-row sm:items-start py-8 sm:py-10 border-b border-border/50 hover:bg-primary/5 transition-colors -mx-4 px-4 sm:mx-0 sm:px-6 rounded-lg sm:rounded-none"
      >
        <div class="flex items-center justify-between sm:w-full">
          <div class="flex flex-col sm:flex-row sm:items-baseline sm:gap-12 flex-1">
            <div class="flex items-baseline gap-6 sm:w-64 shrink-0 mb-2 sm:mb-0">
              <span class="text-xl font-medium text-muted-foreground/50 font-mono">
                {{ forloop.counter|stringformat:"02d" }}
              </span>
              <h2 class="text-xl sm:text-2xl font-black tracking-tight group-hover:text-primary transition-colors text-foreground">
                {{ theme.title }}
              </h2>
            </div>
            <p class="text-muted-foreground sm:text-lg pl-12 sm:pl-0 pr-4 rtl:pl-4 rtl:pr-12 sm:rtl:pr-0">
              {{ theme.desc }}
            </p>
          </div>
          <svg class="w-5 h-5 sm:w-6 sm:h-6 text-muted-foreground/30 group-hover:text-primary group-hover:translate-x-1 rtl:group-hover:-translate-x-1 rtl:rotate-180 transition-all shrink-0 mt-1 sm:mt-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
          </svg>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
